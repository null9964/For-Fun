<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>DULAN 一下</title>
<style>
:root{
  --bg:#111318;--panel:#181b22;--line:#2a2f39;--text:#fff;--muted:#aab1bc;
  --yellow:#ffd84f;--mint:#77e6c7;--red:#ff6b6b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
body{min-height:100dvh;display:flex;justify-content:center}
.app{width:min(100%,560px);padding:12px 12px 26px}
.topline{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
h1{font-size:27px;margin:3px 0 0}
.tag{font-size:12px;color:#111;background:var(--yellow);padding:5px 8px;border-radius:999px;font-weight:900}
.sub{font-size:13px;line-height:1.5;color:var(--muted);margin:6px 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:10px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.row{display:grid;grid-template-columns:1.5fr .8fr;gap:8px}
button,label{appearance:none;border:0;border-radius:14px;background:#272b34;color:#fff;padding:12px 9px;font-weight:850;font-size:14px;text-align:center}
button:active,label:active{transform:scale(.98)}
#photo{display:none}
.stage{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;margin-top:9px;border:1px solid #303540;background:radial-gradient(circle at 50% 25%,#343b47,#15171c 70%);touch-action:none;user-select:none}
canvas{width:100%;height:100%;display:block}
.hint{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#e2e5eb;line-height:1.7;padding:30px;pointer-events:none}
.hint b{font-size:22px}
.hud{position:absolute;left:10px;right:10px;top:10px;display:flex;align-items:center;gap:8px;pointer-events:none}
.combo{font-weight:1000;font-size:18px;text-shadow:0 2px 8px #000}
.rageWrap{height:10px;background:#242832;border-radius:999px;overflow:hidden;flex:1}
.rage{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--yellow),var(--red));transition:width .12s}
.workpop{position:absolute;left:50%;top:18%;transform:translateX(-50%);background:#fff;color:#111;padding:9px 12px;border-radius:14px;font-size:14px;font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:.2s;pointer-events:none;max-width:84%;text-align:center}
.workpop.show{opacity:1}
.footer{display:flex;justify-content:space-between;align-items:center;margin-top:9px;color:#969daa;font-size:12px}
.minibtns{display:flex;gap:7px}
.minibtns button{padding:8px 10px;font-size:12px}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(12px);background:#fff;color:#111;padding:9px 14px;border-radius:999px;font-weight:900;font-size:13px;opacity:0;transition:.2s;z-index:20;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <div class="topline">
    <h1>DULAN 一下 😤</h1>
    <div class="tag">10 秒情绪急救站</div>
  </div>
  <p class="sub">打开 → 拍照 → 自动变成卡通沙包 → 直接狂点、拖、甩。没有问卷，没有选模式，没有确认。</p>

  <div class="card">
    <div class="row">
      <label for="photo">📷 拍一下，直接开干</label>
      <button id="reset">♻️ 重来</button>
    </div>
    <input id="photo" type="file" accept="image/*" capture="environment">

    <div class="stage" id="stage">
      <canvas id="game"></canvas>
      <div class="hud">
        <div class="combo" id="combo">0 COMBO</div>
        <div class="rageWrap"><div class="rage" id="rage"></div></div>
      </div>
      <div class="workpop" id="workpop"></div>
      <div class="hint" id="hint">
        <div><b>😡 现在很 dulan？</b><br>拍一张，回来马上开始<br><small>Tap＝打一下 · Drag＝抓住 · Swipe＝甩飞</small></div>
      </div>
    </div>

    <div class="footer">
      <span>自动沙包 · 自动乱入打工人梗</span>
      <div class="minibtns">
        <button id="mega">💥 大招</button>
        <button id="trash">🗑️ 丢走</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const canvas=$("game"),ctx=canvas.getContext("2d"),stage=$("stage");
const input=$("photo"),hint=$("hint"),comboEl=$("combo"),rageEl=$("rage"),workpop=$("workpop"),toast=$("toast");

let img=null,parts=[],combo=0,rage=0,drag=false,last={x:0,y:0,t:0},lastHit=0;
let obj={x:0,y:0,vx:0,vy:0,rot:0,vr:0,sx:1,sy:1};
let bruise=0, dizzy=0, trashMode=false, maxRage=false;

const workLines=[
"📧 Gentle Reminder","🚨 URGENT","💬 Any update?","📞 Quick call 5 mins?",
"📊 KPI +300%","🕕 5:58 PM：方便聊一下吗？","📁 FINAL_v7_FINAL_REAL2.pptx",
"🖨️ Printer Offline","📊 Excel：#VALUE!","🥔 这个不是我负责的",
"👨‍💼 这个应该很简单吧？","💬 今天可以给吗？","📨 Kindly revert ASAP",
"🫥 我只是来上班的","💸 工资 +$0"
];

function note(t){toast.textContent=t;toast.classList.add("show");clearTimeout(note.t);note.t=setTimeout(()=>toast.classList.remove("show"),900)}
function popWork(){
 const t=workLines[Math.floor(Math.random()*workLines.length)];
 workpop.textContent=t;workpop.classList.add("show");
 clearTimeout(popWork.t);popWork.t=setTimeout(()=>workpop.classList.remove("show"),900);
}
function centerObj(){
 const w=stage.clientWidth,h=stage.clientHeight;
 obj={x:w/2,y:h*.52,vx:0,vy:0,rot:0,vr:0,sx:1,sy:1};
}
function resize(){
 const r=stage.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.floor(r.width*d);canvas.height=Math.floor(r.height*d);ctx.setTransform(d,0,0,d,0,0);
 if(!obj.x)centerObj();
}
addEventListener("resize",resize);resize();

input.onchange=e=>{
 const f=e.target.files?.[0];if(!f)return;
 const u=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{
   img=im;hint.style.display="none";URL.revokeObjectURL(u);
   combo=0;rage=0;bruise=0;dizzy=0;trashMode=false;maxRage=false;centerObj();updateHUD();
   note("拍好了，直接开干 😤");
 };
 im.src=u;
};

$("reset").onclick=()=>{
 img=null;parts=[];combo=0;rage=0;bruise=0;dizzy=0;trashMode=false;maxRage=false;
 input.value="";hint.style.display="grid";centerObj();updateHUD();
};

function updateHUD(){comboEl.textContent=combo+" COMBO";rageEl.style.width=Math.min(rage,100)+"%"}
function addHit(power=1){
 const now=performance.now();
 combo=(now-lastHit<900)?combo+1:1;lastHit=now;
 rage=Math.min(100,rage+2.2*power);bruise=Math.min(5,bruise+.20*power);dizzy=Math.min(1,dizzy+.03*power);
 updateHUD();
 if(combo%8===0)popWork();
 if(rage>=100&&!maxRage){maxRage=true;note("🔥 DULAN MAX 🔥");megaMove()}
}
function hit(x,y,power=1){
 addHit(power);
 obj.vx+=(obj.x-x)*.035*power+(Math.random()-.5)*2;
 obj.vy+=(obj.y-y)*.03*power-1.5*power;
 obj.vr+=(Math.random()-.5)*.22*power;
 obj.sx=1.12;obj.sy=.88;
 const words=["BONK!","POW!","啪叽","烦恼-1","KPI -1%","工资 +$0","😤","✨"];
 for(let i=0;i<5;i++)parts.push({t:"txt",txt:words[Math.floor(Math.random()*words.length)],x:obj.x+(Math.random()-.5)*45,y:obj.y+(Math.random()-.5)*65,vx:(Math.random()-.5)*3,vy:-1.5-Math.random()*2,l:55,s:15+Math.random()*9});
}
function megaMove(){
 for(let i=0;i<18;i++)setTimeout(()=>hit(obj.x+(Math.random()-.5)*120,obj.y+(Math.random()-.5)*160,1.3),i*45);
 setTimeout(()=>{obj.vx=(Math.random()>.5?1:-1)*13;obj.vy=-13;obj.vr=.42;popWork()},450);
}
$("mega").onclick=()=>{if(!img)return note("先拍一下");megaMove();rage=Math.min(100,rage+18);updateHUD()};
$("trash").onclick=()=>{if(!img)return note("先拍一下");trashMode=true;obj.vx=(stage.clientWidth-obj.x)*.09;obj.vy=10;obj.vr=.28;note("🗑️ 送走")};

stage.addEventListener("pointerdown",e=>{
 if(!img)return;
 const r=stage.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 if(Math.hypot(x-obj.x,y-obj.y)<155){
   drag=true;last={x,y,t:performance.now()};stage.setPointerCapture?.(e.pointerId);
 }else hit(x,y,1);
});
stage.addEventListener("pointermove",e=>{
 if(!drag)return;
 const r=stage.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,now=performance.now(),dt=Math.max(16,now-last.t);
 obj.vx=(x-last.x)/dt*16;obj.vy=(y-last.y)/dt*16;obj.x=x;obj.y=y;last={x,y,t:now};
});
stage.addEventListener("pointerup",()=>{if(drag){drag=false;addHit(1.5)}});
stage.addEventListener("pointercancel",()=>drag=false);

function drawFaceBadge(){
 if(!img)return;
 const tiny=document.createElement("canvas");tiny.width=40;tiny.height=40;
 const t=tiny.getContext("2d"),side=Math.min(img.width,img.height),sx=(img.width-side)/2,sy=(img.height-side)/2;
 t.drawImage(img,sx,sy,side,side,0,0,40,40);
 ctx.imageSmoothingEnabled=false;ctx.drawImage(tiny,-47,-47,94,94);ctx.imageSmoothingEnabled=true;
}

function drawBag(){
 ctx.save();ctx.translate(obj.x,obj.y);ctx.rotate(obj.rot);ctx.scale(obj.sx,obj.sy);
 // chain
 ctx.strokeStyle="#b8bec7";ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(0,-265);ctx.lineTo(0,-160);ctx.stroke();
 // bag body
 const grad=ctx.createLinearGradient(-90,0,90,0);grad.addColorStop(0,"#7c2e2b");grad.addColorStop(.5,"#bd4a3c");grad.addColorStop(1,"#7d2f2a");
 ctx.fillStyle=grad;ctx.beginPath();ctx.roundRect(-92,-160,184,322,62);ctx.fill();
 ctx.fillStyle="#5e2622";ctx.fillRect(-92,-112,184,16);

 // face badge
 ctx.save();ctx.beginPath();ctx.arc(0,-52,52,0,Math.PI*2);ctx.clip();drawFaceBadge();ctx.restore();
 ctx.strokeStyle="#fff";ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,-52,52,0,Math.PI*2);ctx.stroke();

 // cartoon "beat-up" indicators: non-graphic, exaggerated
 if(bruise>1){
   ctx.globalAlpha=Math.min(.85,bruise/5);
   ctx.fillStyle="#7b5aa6";ctx.beginPath();ctx.ellipse(-28,-64,17,9,-.25,0,Math.PI*2);ctx.fill();
   ctx.fillStyle="#5d79a8";ctx.beginPath();ctx.ellipse(27,-40,15,8,.3,0,Math.PI*2);ctx.fill();
   ctx.globalAlpha=1;
 }
 if(dizzy>.15){
   ctx.font="30px system-ui";ctx.textAlign="center";ctx.fillText("😵",0,-35);
   ctx.font="24px system-ui";ctx.fillText("⭐",58,-96);ctx.fillText("💫",-62,-91);
 }
 ctx.font="900 22px system-ui";ctx.fillStyle="#fff";ctx.fillText("烦恼沙包",0,62);
 ctx.font="700 14px system-ui";ctx.fillText("今天的破事都在这里",0,90);

 ctx.restore();
}

function physics(){
 if(drag)return;
 const w=stage.clientWidth,h=stage.clientHeight;
 obj.vy+=.26;obj.x+=obj.vx;obj.y+=obj.vy;obj.rot+=obj.vr;
 obj.vx*=.986;obj.vy*=.992;obj.vr*=.991;
 obj.sx+=(1-obj.sx)*.15;obj.sy+=(1-obj.sy)*.15;
 const rx=105,ry=165;
 if(obj.x<rx){obj.x=rx;obj.vx=Math.abs(obj.vx)*.76;obj.vr+=.04}
 if(obj.x>w-rx){obj.x=w-rx;obj.vx=-Math.abs(obj.vx)*.76;obj.vr-=.04}
 if(obj.y<ry){obj.y=ry;obj.vy=Math.abs(obj.vy)*.7}
 if(obj.y>h-ry){obj.y=h-ry;obj.vy=-Math.abs(obj.vy)*.7}
 obj.vx+=(w/2-obj.x)*.0038;obj.vy+=(h*.52-obj.y)*.0038;

 if(trashMode && obj.y>h-190){
   parts.push({t:"txt",txt:"🗑️ 下班！",x:w/2,y:h*.72,vx:0,vy:-1,l:90,s:34});
   trashMode=false;setTimeout(()=>{centerObj();bruise=0;dizzy=0},500);
 }
}

function drawTrash(){
 if(!trashMode)return;
 const w=stage.clientWidth,h=stage.clientHeight;
 ctx.font="84px system-ui";ctx.textAlign="center";ctx.fillText("🗑️",w*.78,h*.86);
}

function loop(){
 const w=stage.clientWidth,h=stage.clientHeight;
 ctx.clearRect(0,0,w,h);
 if(img){physics();drawTrash();drawBag()}
 for(const p of parts){
   ctx.save();ctx.font=p.s+"px system-ui";ctx.textAlign="center";ctx.fillText(p.txt,p.x,p.y);ctx.restore();
   p.x+=p.vx;p.y+=p.vy;p.l--;
 }
 parts=parts.filter(p=>p.l>0&&p.y<h+120);
 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
