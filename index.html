<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<title>DULAN.exe — Private Rage Room</title>
<style>
:root{
  --bg:#0b0d10;
  --panel:#11151a;
  --panel2:#171c22;
  --line:#2b323a;
  --text:#f2f4f7;
  --muted:#8c96a3;
  --accent:#d7ff43;
  --danger:#ff5a5f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif}
body{min-height:100dvh;display:flex;justify-content:center;overflow:hidden}
.app{
  width:min(100%,620px);
  min-height:100dvh;
  padding:14px;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(900px 460px at 50% -15%,#202833 0,#101419 45%,#0b0d10 100%);
}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:12px}
.brand h1{margin:0;font-size:24px;letter-spacing:.4px}
.brand p{margin:4px 0 0;color:var(--muted);font-size:11px;letter-spacing:.5px}
.status{font-size:10px;font-weight:900;color:#111;background:var(--accent);padding:7px 9px;border-radius:999px;white-space:nowrap}
.shell{
  flex:1;
  min-height:0;
  border:1px solid var(--line);
  border-radius:24px;
  padding:9px;
  background:rgba(255,255,255,.02);
  box-shadow:0 28px 80px rgba(0,0,0,.38)
}
.stage{
  position:relative;
  width:100%;
  height:100%;
  min-height:610px;
  overflow:hidden;
  border-radius:18px;
  border:1px solid #222832;
  background:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(180deg,#171c22,#101419 70%,#0d1014);
  background-size:36px 36px,36px 36px,auto;
  touch-action:none;
  user-select:none;
}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.start{
  position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;
  text-align:center;padding:28px;background:rgba(8,10,13,.78);backdrop-filter:blur(8px)
}
.start.hide{display:none}
.start .eyebrow{font-size:10px;letter-spacing:1.6px;color:var(--muted);font-weight:900;margin-bottom:12px}
.start h2{margin:0;font-size:31px;line-height:1.1}
.start p{max-width:330px;margin:10px 0 22px;color:#9ca6b3;font-size:12px;line-height:1.55}
.fireBtn{
  width:170px;height:170px;border-radius:50%;border:1px solid #303741;background:#11151a;color:#fff;
  font-size:30px;font-weight:1000;letter-spacing:.6px;
  box-shadow:0 18px 0 #050607,0 28px 60px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.03)
}
.fireBtn:active{transform:translateY(7px);box-shadow:0 11px 0 #050607,0 20px 45px rgba(0,0,0,.35)}
.pick{margin-top:20px;color:#b9c1cb;font-size:12px;border:1px solid #303741;background:#14191f;padding:9px 13px;border-radius:999px;font-weight:800}
#photo{display:none}

.hud{
  position:absolute;left:12px;right:12px;top:12px;z-index:8;display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;
  pointer-events:none
}
.metric{font-size:11px;font-weight:950;background:#0d1014;border:1px solid #2a3139;padding:7px 9px;border-radius:10px}
.releaseTrack{height:9px;background:#090b0e;border:1px solid #2a3139;border-radius:999px;overflow:hidden}
.release{height:100%;width:0;background:linear-gradient(90deg,#83949f,#c0c8cd,var(--accent));transition:width .08s}
.timer{font-variant-numeric:tabular-nums}

.toast{
  position:absolute;left:50%;top:19%;transform:translate(-50%,-6px);z-index:10;
  background:#0c0f13;border:1px solid #303741;color:#f2f4f7;padding:10px 13px;border-radius:12px;
  font-size:12px;font-weight:900;opacity:0;transition:.16s;pointer-events:none;box-shadow:0 14px 35px rgba(0,0,0,.28)
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.workCard{
  position:absolute;z-index:12;min-width:210px;max-width:280px;
  background:#e9edf1;color:#11161c;border-radius:10px;padding:12px 14px;border:1px solid #fff;
  box-shadow:0 22px 50px rgba(0,0,0,.35);touch-action:none
}
.workCard .meta{display:flex;justify-content:space-between;gap:10px;color:#69717b;font-size:9px;font-weight:900;letter-spacing:.9px;margin-bottom:7px}
.workCard .title{font-size:15px;font-weight:1000}
.workCard .hint{font-size:10px;color:#737b85;margin-top:6px}
.workCard.dismiss{transition:transform .28s ease,opacity .28s ease;opacity:0}

.chargeWrap{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:10;width:66%;display:none;pointer-events:none}
.chargeWrap.show{display:block}
.chargeLabel{text-align:center;font-size:10px;font-weight:1000;letter-spacing:1px;margin-bottom:6px}
.chargeTrack{height:12px;border-radius:999px;background:#090b0e;border:1px solid #303741;overflow:hidden}
.charge{height:100%;width:0;background:linear-gradient(90deg,#667784,#b4bec5,var(--accent))}

.bottom{
  position:absolute;left:12px;right:12px;bottom:12px;z-index:9;display:grid;grid-template-columns:1fr 1fr;gap:8px
}
.bottom button,.bottom label{
  border:1px solid #303741;background:rgba(12,15,19,.88);color:#e7ebf0;border-radius:12px;padding:11px 10px;
  font-size:11px;font-weight:900;text-align:center;backdrop-filter:blur(10px)
}

.ending{
  position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;flex-direction:column;
  background:#0b0d10;text-align:center;padding:30px
}
.ending.show{display:flex}
.ending .time{font-size:58px;font-weight:300;letter-spacing:1px}
.ending h3{font-size:24px;margin:8px 0 5px}
.ending p{color:#8d97a4;font-size:12px;margin:0 0 20px}
.again{border:1px solid #303741;background:#14191f;color:#fff;padding:12px 18px;border-radius:12px;font-size:12px;font-weight:900}

.editorBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(5px);z-index:40;display:none}
.editorBackdrop.show{display:block}
.editor{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,620px);z-index:41;display:none;
  background:#11151a;border:1px solid #303741;border-bottom:0;border-radius:22px 22px 0 0;padding:16px
}
.editor.show{display:block}
.editor h3{margin:0 0 3px;font-size:17px}.editor p{margin:0 0 14px;color:#8f99a6;font-size:11px}
.row{margin:12px 0}.row label{display:block;margin-bottom:6px;font-size:11px;font-weight:900;color:#d7dce2}
.range{width:100%}
.editorActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.editorActions button{padding:11px;border-radius:10px;border:1px solid #303741;background:#171c22;color:#fff;font-size:11px;font-weight:900}
.editorActions .primary{background:var(--accent);color:#111;border-color:transparent}

@media(max-width:430px){
  .stage{min-height:585px}
  .start h2{font-size:28px}
  .fireBtn{width:155px;height:155px;font-size:27px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <h1>DULAN.exe</h1>
      <p>PRIVATE RAGE ROOM / SESSION 01</p>
    </div>
    <div class="status">RAGE DETECTED</div>
  </div>

  <div class="shell">
    <div class="stage" id="stage">
      <canvas id="game"></canvas>

      <div class="hud">
        <div class="metric" id="impact">IMPACT 0</div>
        <div class="releaseTrack"><div class="release" id="release"></div></div>
        <div class="metric timer" id="timer">00:00</div>
      </div>

      <div class="toast" id="toast"></div>

      <div class="chargeWrap" id="chargeWrap">
        <div class="chargeLabel">PRESSURE BUILDING</div>
        <div class="chargeTrack"><div class="charge" id="charge"></div></div>
      </div>

      <div class="start" id="start">
        <div class="eyebrow">NO QUESTIONS. NO EXPLANATION.</div>
        <h2>Leave it here.</h2>
        <p>拍一张让你烦的人或东西。回来以后，照片会放进一个“Problem Target”里，直接开始。</p>
        <button class="fireBtn" id="startBtn">START</button>
        <label class="pick" for="photo">拍照 / 选照片</label>
        <input id="photo" type="file" accept="image/*" capture="environment">
      </div>

      <div class="ending" id="ending">
        <div class="time">18:00</div>
        <h3>SESSION COMPLETE</h3>
        <p>Leave it here.</p>
        <button class="again" id="again">Again</button>
      </div>

      <div class="bottom">
        <label for="photo">换照片</label>
        <button id="editBtn">调整照片</button>
      </div>
    </div>
  </div>
</div>

<div class="editorBackdrop" id="editorBackdrop"></div>
<div class="editor" id="editor">
  <h3>调整照片</h3>
  <p>只调位置和大小，不加幼稚滤镜。</p>
  <div class="row">
    <label>缩放</label>
    <input class="range" id="scale" type="range" min="0.8" max="2.4" step="0.01" value="1.18">
  </div>
  <div class="row">
    <label>左右位置</label>
    <input class="range" id="posX" type="range" min="-1" max="1" step="0.01" value="0">
  </div>
  <div class="row">
    <label>上下位置</label>
    <input class="range" id="posY" type="range" min="-1" max="1" step="0.01" value="0">
  </div>
  <div class="row">
    <label>像素化程度</label>
    <input class="range" id="pixel" type="range" min="18" max="80" step="1" value="36">
  </div>
  <div class="editorActions">
    <button id="resetEdit">重置</button>
    <button class="primary" id="doneEdit">完成</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const stage=$("stage"), canvas=$("game"), ctx=canvas.getContext("2d");
const photo=$("photo"), start=$("start"), impactEl=$("impact"), releaseEl=$("release"), timerEl=$("timer");
const toast=$("toast"), chargeWrap=$("chargeWrap"), chargeEl=$("charge"), ending=$("ending");
const editor=$("editor"), editorBackdrop=$("editorBackdrop");
const scaleInput=$("scale"), posXInput=$("posX"), posYInput=$("posY"), pixelInput=$("pixel");

let img=null, parts=[], cardEl=null, cardState=null;
let target={x:0,y:0,vx:0,vy:0,rot:0,vr:0,sx:1,sy:1};
let pointer={down:false,drag:false,sx:0,sy:0,x:0,y:0,st:0,t:0};
let impact=0, release=0, startedAt=0, lastImpact=0, shake=0;
let holdTimer=null, charging=false, chargeStart=0;
let edit={scale:1.18,x:0,y:0,pixel:36};

const cards=[
  ["URGENT","Need this before EOD."],
  ["GENTLE REMINDER","Any update?"],
  ["MEETING","5:58 PM · Quick call?"],
  ["KPI REVIEW","Target revised +300%"],
  ["FINAL FILE","FINAL_v14_REAL_FINAL_USE_THIS.xlsx"],
  ["TEAMS","Incoming call..."],
  ["PRINTER","Paper jam. Again."],
  ["HANDOVER","This is not my scope."]
];

function resize(){
  const r=stage.getBoundingClientRect(), d=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.floor(r.width*d); canvas.height=Math.floor(r.height*d);
  ctx.setTransform(d,0,0,d,0,0);
  if(!target.x) resetTarget();
}
addEventListener("resize",resize); resize();

function resetTarget(){
  const w=stage.clientWidth,h=stage.clientHeight;
  target={x:w/2,y:h*.53,vx:0,vy:0,rot:0,vr:0,sx:1,sy:1};
}
function showToast(t,ms=800){
  toast.textContent=t; toast.classList.add("show");
  clearTimeout(showToast.t); showToast.t=setTimeout(()=>toast.classList.remove("show"),ms);
}
function buzz(ms=18){ if(navigator.vibrate) navigator.vibrate(ms); }
function beep(freq=90,dur=.055){
  try{
    const ac=beep.ac||(beep.ac=new (window.AudioContext||window.webkitAudioContext)());
    const o=ac.createOscillator(),g=ac.createGain();
    o.type="sine"; o.frequency.value=freq; g.gain.value=.04;
    o.connect(g); g.connect(ac.destination); o.start();
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
    o.stop(ac.currentTime+dur);
  }catch{}
}
function updateHUD(){
  impactEl.textContent="IMPACT "+impact;
  releaseEl.style.width=Math.min(100,release)+"%";
}
function txt(t,x,y,s=15){
  parts.push({txt:t,x,y,vx:(Math.random()-.5)*2.5,vy:-1.2-Math.random()*1.6,l:50,s})
}
function registerImpact(power=1){
  const now=performance.now();
  impact += Math.max(1,Math.round(power));
  release = Math.min(100,release+2.6*power);
  lastImpact=now; updateHUD();
  if(impact===10) showToast("PRESSURE RELEASED 12%");
  if(impact===25) showToast("NOT YOUR PROBLEM.");
  if(impact===45) spawnWorkCard();
  if(impact===70) spawnWorkCard();
  if(release>=100) setTimeout(finishSession,260);
}
function impactHit(x,y,power=1){
  registerImpact(power);
  shake=Math.min(16,shake+5*power);
  target.vx+=(target.x-x)*.045*power+(Math.random()-.5)*1.5;
  target.vy+=(target.y-y)*.035*power-1.8*power;
  target.vr+=(Math.random()-.5)*.12*power;
  target.sx=1.05; target.sy=.93;
  beep(72+Math.random()*24,.05); buzz(16);
  txt("THUD",target.x+(Math.random()-.5)*35,target.y+(Math.random()-.5)*55,13);
}
function startCharge(){
  charging=true; chargeStart=performance.now(); chargeWrap.classList.add("show");
}
function releaseCharge(){
  if(!charging)return;
  const power=Math.min(4,(performance.now()-chargeStart)/520+1);
  charging=false; chargeWrap.classList.remove("show"); chargeEl.style.width="0";
  showToast("RELEASE");
  impactHit(target.x-120,target.y,power);
  target.vx+=(Math.random()>.5?1:-1)*8*power;
  target.vy-=5*power; beep(55,.12); buzz(50);
}
function swipeAction(dx,dy,dt){
  const speed=Math.hypot(dx,dy)/Math.max(dt,1);
  if(Math.max(Math.abs(dx),Math.abs(dy))<60||speed<.22)return false;

  if(Math.abs(dx)>Math.abs(dy)){
    target.vx=Math.sign(dx)*Math.min(20,7+speed*10); target.vy=-2; target.vr=Math.sign(dx)*.2;
    showToast("REMOVED."); registerImpact(2);
  }else if(dy<0){
    target.vy=-22; target.vx=dx*.05; target.vr=.22;
    showToast("ARCHIVED."); registerImpact(2.4);
  }else{
    showToast("SHREDDED."); registerImpact(2.4); shredEnding();
  }
  return true;
}

stage.addEventListener("pointerdown",e=>{
  if(!img||ending.classList.contains("show")||editor.classList.contains("show"))return;
  const r=stage.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,now=performance.now();
  pointer={down:true,drag:false,sx:x,sy:y,x,y,st:now,t:now};
  if(Math.hypot(x-target.x,y-target.y)<210){
    holdTimer=setTimeout(()=>{if(pointer.down&&!pointer.drag)startCharge()},420);
  } else impactHit(x,y,1);
  stage.setPointerCapture?.(e.pointerId);
});
stage.addEventListener("pointermove",e=>{
  if(!pointer.down)return;
  const r=stage.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,now=performance.now();
  const moved=Math.hypot(x-pointer.sx,y-pointer.sy);
  if(moved>12){
    clearTimeout(holdTimer);
    if(charging){charging=false;chargeWrap.classList.remove("show");chargeEl.style.width="0"}
  }
  if(moved>18&&Math.hypot(pointer.sx-target.x,pointer.sy-target.y)<220){
    pointer.drag=true;
    const dt=Math.max(16,now-pointer.t);
    target.vx=(x-pointer.x)/dt*16; target.vy=(y-pointer.y)/dt*16;
    target.x=x; target.y=y;
  }
  pointer.x=x; pointer.y=y; pointer.t=now;
});
stage.addEventListener("pointerup",e=>{
  if(!pointer.down)return;
  clearTimeout(holdTimer);
  const r=stage.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,now=performance.now();
  const dx=x-pointer.sx,dy=y-pointer.sy,dt=now-pointer.st;
  if(charging) releaseCharge();
  else if(pointer.drag){ if(!swipeAction(dx,dy,dt)) registerImpact(1.2); }
  else if(Math.hypot(dx,dy)<12&&dt<420) impactHit(x,y,1);
  else swipeAction(dx,dy,dt);
  pointer.down=false; pointer.drag=false;
});
stage.addEventListener("pointercancel",()=>{pointer.down=false;pointer.drag=false;clearTimeout(holdTimer);charging=false;chargeWrap.classList.remove("show")});

function spawnWorkCard(){
  if(cardEl)return;
  const [title,body]=cards[Math.floor(Math.random()*cards.length)];
  const el=document.createElement("div"); el.className="workCard";
  el.innerHTML=`<div class="meta"><span>CORPORATE INTERRUPTION</span><span>SWIPE</span></div><div class="title">${title}</div><div class="hint">${body}</div>`;
  stage.appendChild(el); cardEl=el;
  const w=stage.clientWidth,h=stage.clientHeight;
  el.style.left=(w*(.28+Math.random()*.44))+"px";
  el.style.top=(h*(.26+Math.random()*.34))+"px";
  el.style.transform="translate(-50%,-50%)";
  cardState={down:false,sx:0,sy:0};
  el.onpointerdown=ev=>{cardState.down=true;cardState.sx=ev.clientX;cardState.sy=ev.clientY;el.setPointerCapture?.(ev.pointerId)};
  el.onpointermove=ev=>{
    if(!cardState.down)return;
    const dx=ev.clientX-cardState.sx,dy=ev.clientY-cardState.sy;
    el.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) rotate(${dx*.04}deg)`;
  };
  el.onpointerup=ev=>{
    const dx=ev.clientX-cardState.sx,dy=ev.clientY-cardState.sy; cardState.down=false;
    if(Math.hypot(dx,dy)>55){
      el.classList.add("dismiss");
      el.style.transform=`translate(calc(-50% + ${dx*5}px),calc(-50% + ${dy*5}px)) rotate(${dx*.15}deg)`;
      showToast("DECLINED."); beep(115,.05);
      setTimeout(()=>{el.remove();cardEl=null},300);
    }else el.style.transform="translate(-50%,-50%)";
  };
  setTimeout(()=>{if(cardEl===el){el.classList.add("dismiss");setTimeout(()=>{el.remove();cardEl=null},300)}},4200);
}

function loadFile(file){
  if(!file)return;
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{
    img=im; URL.revokeObjectURL(url);
    start.classList.add("hide");
    impact=0; release=0; startedAt=performance.now(); parts=[]; resetTarget(); updateHUD();
    showToast("SESSION STARTED"); buzz(30);
  };
  im.src=url;
}
photo.onchange=e=>loadFile(e.target.files?.[0]);
$("startBtn").onclick=()=>photo.click();

function drawPhoto(x,y,w,h){
  const p=Math.max(18,Math.round(edit.pixel));
  const tiny=document.createElement("canvas"); tiny.width=p; tiny.height=p;
  const t=tiny.getContext("2d");
  t.drawImage(img,0,0,img.width,img.height,0,0,p,p);
  ctx.save();
  ctx.beginPath(); ctx.roundRect(x,y,w,h,10); ctx.clip();
  ctx.imageSmoothingEnabled=false;
  const dw=w*edit.scale, dh=h*edit.scale;
  ctx.drawImage(tiny, x+(w-dw)/2+edit.x*w*.55, y+(h-dh)/2+edit.y*h*.55, dw, dh);
  ctx.imageSmoothingEnabled=true;
  ctx.restore();
}
function drawTarget(){
  ctx.save();
  ctx.translate(target.x+(Math.random()-.5)*shake,target.y+(Math.random()-.5)*shake);
  ctx.rotate(target.rot); ctx.scale(target.sx,target.sy);

  // suspension
  ctx.strokeStyle="#5e6873";ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(0,-320);ctx.lineTo(0,-210);ctx.stroke();

  // industrial target body
  const g=ctx.createLinearGradient(-125,0,125,0);
  g.addColorStop(0,"#171a1f");g.addColorStop(.45,"#2a3037");g.addColorStop(.55,"#20252b");g.addColorStop(1,"#111419");
  ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(-120,-210,240,420,34);ctx.fill();
  ctx.strokeStyle="#3b434d";ctx.lineWidth=2;ctx.stroke();

  // hazard stripe
  for(let i=-110;i<110;i+=28){
    ctx.save();ctx.translate(i,-165);ctx.rotate(-.5);ctx.fillStyle=i%56===0?"#d7ff43":"#2c3238";ctx.fillRect(0,0,22,18);ctx.restore();
  }

  // photo plate
  ctx.fillStyle="#0d1014";ctx.beginPath();ctx.roundRect(-88,-120,176,220,14);ctx.fill();
  drawPhoto(-80,-112,160,204);
  ctx.strokeStyle="#68727d";ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(-88,-120,176,220,14);ctx.stroke();

  // labels
  ctx.fillStyle="#d7ff43";ctx.font="900 16px system-ui";ctx.textAlign="center";ctx.fillText("PROBLEM TARGET",0,137);
  ctx.fillStyle="#8e98a4";ctx.font="800 10px system-ui";ctx.fillText("IMPACT / DRAG / THROW",0,158);

  ctx.restore();
  shake*=.78;
}
function physics(){
  if(pointer.drag)return;
  const w=stage.clientWidth,h=stage.clientHeight;
  target.vy+=.22; target.x+=target.vx; target.y+=target.vy; target.rot+=target.vr;
  target.vx*=.986; target.vy*=.993; target.vr*=.991;
  target.sx+=(1-target.sx)*.15; target.sy+=(1-target.sy)*.15;

  const rx=135,ry=225;
  if(target.x<rx){target.x=rx;target.vx=Math.abs(target.vx)*.72}
  if(target.x>w-rx){target.x=w-rx;target.vx=-Math.abs(target.vx)*.72}
  if(target.y<ry){target.y=ry;target.vy=Math.abs(target.vy)*.68}
  if(target.y>h-ry-34){target.y=h-ry-34;target.vy=-Math.abs(target.vy)*.66}
  target.vx+=(w/2-target.x)*.0045; target.vy+=(h*.53-target.y)*.0045;
}

function shredEnding(){
  target.vy=18; target.vx=7; target.vr=.28;
  setTimeout(finishSession,650);
}
function finishSession(){
  if(ending.classList.contains("show"))return;
  ending.classList.add("show");
}
$("again").onclick=()=>{
  impact=0; release=0; parts=[]; startedAt=performance.now(); resetTarget(); updateHUD(); ending.classList.remove("show"); showToast("SESSION RESTARTED");
};

$("editBtn").onclick=()=>{
  if(!img){showToast("先拍照");return}
  editorBackdrop.classList.add("show"); editor.classList.add("show");
}
function closeEditor(){editorBackdrop.classList.remove("show");editor.classList.remove("show")}
editorBackdrop.onclick=closeEditor;
$("doneEdit").onclick=closeEditor;
$("resetEdit").onclick=()=>{
  edit={scale:1.18,x:0,y:0,pixel:36};
  scaleInput.value=edit.scale;posXInput.value=edit.x;posYInput.value=edit.y;pixelInput.value=edit.pixel;
}
scaleInput.oninput=()=>edit.scale=parseFloat(scaleInput.value);
posXInput.oninput=()=>edit.x=parseFloat(posXInput.value);
posYInput.oninput=()=>edit.y=parseFloat(posYInput.value);
pixelInput.oninput=()=>edit.pixel=parseInt(pixelInput.value,10);

function loop(){
  const w=stage.clientWidth,h=stage.clientHeight;
  ctx.clearRect(0,0,w,h);
  if(img){physics();drawTarget()}
  if(charging){
    const pct=Math.min(100,(performance.now()-chargeStart)/900*100);
    chargeEl.style.width=pct+"%";
  }
  if(startedAt&&!ending.classList.contains("show")){
    const sec=Math.floor((performance.now()-startedAt)/1000);
    timerEl.textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
  }
  for(const q of parts){
    ctx.save();ctx.font=q.s+"px system-ui";ctx.textAlign="center";ctx.fillStyle="#d7dde4";ctx.fillText(q.txt,q.x,q.y);ctx.restore();
    q.x+=q.vx;q.y+=q.vy;q.l--;
  }
  parts=parts.filter(q=>q.l>0&&q.y<h+100);
  requestAnimationFrame(loop);
}
loop();
</script>
