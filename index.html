<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e1014">
<title>DULAN 一下</title>
<style>
:root{
  --bg:#0e1014;--panel:#171a21;--line:#2a303a;--text:#fff;--muted:#9ea6b3;
  --yellow:#ffd84f;--mint:#79e6c8;--red:#ff6b6b;--blue:#72b9ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}
body{min-height:100dvh;display:flex;justify-content:center;overflow-x:hidden}
.app{width:min(100%,560px);min-height:100dvh;padding:14px 12px 22px;display:flex;flex-direction:column}
.header{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
h1{font-size:28px;margin:0;letter-spacing:.2px}
.badge{font-size:11px;background:var(--yellow);color:#111;border-radius:999px;padding:5px 8px;font-weight:950}
.subtitle{margin:5px 0 10px;color:var(--muted);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:10px;box-shadow:0 18px 50px rgba(0,0,0,.28);flex:1;display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:560px;border-radius:18px;overflow:hidden;border:1px solid #303640;background:
radial-gradient(circle at 50% 24%,#343c49 0,#242a33 28%,#15181e 70%);
touch-action:none;user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.start{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:28px;text-align:center;background:linear-gradient(180deg,rgba(14,16,20,.25),rgba(14,16,20,.62));
  z-index:5
}
.start.hide{display:none}
.startBig{
  width:168px;height:168px;border-radius:50%;border:0;background:var(--yellow);color:#111;
  font-size:35px;font-weight:1000;box-shadow:0 14px 45px rgba(255,216,79,.24);cursor:pointer
}
.startBig:active{transform:scale(.96)}
.pickSmall{appearance:none;border:0;background:#242932;color:white;border-radius:999px;padding:10px 14px;font-size:13px;font-weight:850}
#photo{display:none}

.hud{position:absolute;left:10px;right:10px;top:10px;z-index:4;display:flex;align-items:center;gap:8px;pointer-events:none}
.combo{font-size:17px;font-weight:1000;text-shadow:0 2px 7px #000;min-width:94px}
.rageWrap{height:10px;background:#242a33;border-radius:999px;overflow:hidden;flex:1}
.rage{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--yellow),var(--red));transition:width .1s}

.chargeWrap{position:absolute;left:50%;bottom:82px;transform:translateX(-50%);z-index:4;width:68%;display:none;pointer-events:none}
.chargeWrap.show{display:block}
.chargeLabel{text-align:center;font-weight:1000;font-size:13px;margin-bottom:5px;text-shadow:0 2px 6px #000}
.chargeTrack{height:12px;border-radius:99px;background:#20252d;overflow:hidden}
.charge{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--yellow),var(--red))}

.pop{
 position:absolute;left:50%;top:18%;transform:translate(-50%,0);z-index:6;
 background:#fff;color:#111;padding:10px 13px;border-radius:15px;font-weight:950;font-size:14px;
 box-shadow:0 10px 28px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.15s;max-width:84%;text-align:center
}
.pop.show{opacity:1}
.reward{top:28%;background:#171a21;color:#fff;border:1px solid #373e49}

.intrusion{
 position:absolute;z-index:7;min-width:170px;max-width:250px;background:#fff;color:#111;border-radius:17px;
 padding:12px 14px;box-shadow:0 14px 34px rgba(0,0,0,.32);font-weight:900;touch-action:none;
 transform:translate(-50%,-50%);left:50%;top:38%;cursor:grab
}
.intrusion small{display:block;color:#686e77;font-size:11px;margin-top:4px;font-weight:700}
.intrusion.fly{transition:transform .3s ease,opacity .3s ease;opacity:0}

.ending{
 position:absolute;inset:0;z-index:12;background:rgba(10,12,15,.93);display:none;align-items:center;justify-content:center;
 flex-direction:column;text-align:center;padding:30px
}
.ending.show{display:flex}
.ending .time{font-size:54px;font-weight:1000;letter-spacing:1px}
.ending .done{font-size:27px;font-weight:1000;margin:6px 0 20px}
.again{border:0;border-radius:16px;background:var(--yellow);color:#111;padding:13px 18px;font-size:16px;font-weight:1000}
.endingFx{font-size:70px;margin-bottom:12px}

.bottom{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.bottom button,.bottom label{
 appearance:none;border:0;border-radius:14px;background:#272c35;color:#fff;padding:12px 10px;font-size:14px;font-weight:900;text-align:center
}
.tip{margin-top:8px;color:#8f97a5;font-size:11px;text-align:center;line-height:1.4}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>DULAN 一下 😤</h1>
    <span class="badge">打工人的 10 秒情绪急救站</span>
  </div>
  <div class="subtitle">老板不能打，这个可以。打开 → 拍 → 开干。</div>

  <div class="card">
    <div class="stage" id="stage">
      <canvas id="game"></canvas>

      <div class="hud">
        <div class="combo" id="combo">0 COMBO</div>
        <div class="rageWrap"><div class="rage" id="rage"></div></div>
      </div>

      <div class="chargeWrap" id="chargeWrap">
        <div class="chargeLabel">蓄力中…</div>
        <div class="chargeTrack"><div class="charge" id="charge"></div></div>
      </div>

      <div class="pop" id="pop"></div>
      <div class="pop reward" id="reward"></div>

      <div class="start" id="start">
        <button class="startBig" id="startBtn">😡<br>开干</button>
        <label class="pickSmall" for="photo">📷 拍一下 / 选照片</label>
        <input id="photo" type="file" accept="image/*" capture="environment">
        <div style="color:#b5bcc8;font-size:12px;line-height:1.45">拍完自动回来，自动变沙包。<br>不用选模式，不用确认。</div>
      </div>

      <div class="ending" id="ending">
        <div class="endingFx" id="endingFx">🕕</div>
        <div class="time">6:00 PM</div>
        <div class="done">🏃 下班成功</div>
        <button class="again" id="again">还没爽够</button>
      </div>
    </div>

    <div class="bottom">
      <label for="photo">📷 换一个</label>
      <button id="sound">🔊 声音：开</button>
    </div>
    <div class="tip">Tap＝BONK · 连点＝COMBO · 左右 Swipe＝甩飞 · 上 Swipe＝送上天 · 下 Swipe＝丢垃圾桶 · 长按＝蓄力 BOOM · Drag＝拖着走</div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const canvas=$("game"),ctx=canvas.getContext("2d"),stage=$("stage");
const photo=$("photo"),start=$("start"),comboEl=$("combo"),rageEl=$("rage");
const chargeWrap=$("chargeWrap"),chargeEl=$("charge"),popEl=$("pop"),rewardEl=$("reward");
const ending=$("ending"),endingFx=$("endingFx"),soundBtn=$("sound");

let img=null,parts=[],combo=0,rage=0,lastHit=0,soundOn=true,maxTriggered=false;
let obj={x:0,y:0,vx:0,vy:0,rot:0,vr:0,sx:1,sy:1};
let pointer={down:false,drag:false,startX:0,startY:0,lastX:0,lastY:0,startT:0,lastT:0};
let holdTimer=null,charging=false,chargeStart=0,bruise=0,dizzy=0;
let intrusionEl=null,intrusionState=null;

const workLines=[
"📧 Gentle Reminder","📧 Friendly Reminder","🚨 URGENT","💬 Any update?",
"👨‍💼 这个应该很简单吧？","👨‍💼 今天可以给吗？","📊 KPI +300%",
"🕕 5:58 PM：可以 quick call 一下吗？","📁 FINAL_v7_FINAL_REAL_FINAL2.pptx",
"🖨️ Printer Offline","📊 Excel：#VALUE!","📞 Teams：Incoming Call...",
"🥔 这个不是我负责的。","📨 Kindly revert ASAP","🫥 我只是来上班的"
];
const rewards=[
["BONK!","精神状态 +2"],["20 COMBO","工资 +$0"],["50 COMBO","KPI -1%"],
["80 COMBO","老板音量 -70%"],["100 COMBO","准时下班概率 +0.01%"],
["今日奖励","多一杯 kopi"],["系统提示","这版真的是 FINAL（才怪）"]
];

function resize(){
 const r=stage.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.floor(r.width*d);canvas.height=Math.floor(r.height*d);ctx.setTransform(d,0,0,d,0,0);
 if(!obj.x)centerObj();
}
addEventListener("resize",resize);resize();

function centerObj(){
 const w=stage.clientWidth,h=stage.clientHeight;
 obj={x:w/2,y:h*.54,vx:0,vy:0,rot:0,vr:0,sx:1,sy:1};
}

function updateHUD(){
 comboEl.textContent=combo+" COMBO";
 rageEl.style.width=Math.min(100,rage)+"%";
}
function popup(txt,ms=850){
 popEl.textContent=txt;popEl.classList.add("show");
 clearTimeout(popup.t);popup.t=setTimeout(()=>popEl.classList.remove("show"),ms);
}
function reward(title,txt){
 rewardEl.textContent=title+" · "+txt;rewardEl.classList.add("show");
 clearTimeout(reward.t);reward.t=setTimeout(()=>rewardEl.classList.remove("show"),1100);
}

function beep(freq=160,dur=.05){
 if(!soundOn)return;
 try{
   const ac=beep.ac||(beep.ac=new (window.AudioContext||window.webkitAudioContext)());
   const o=ac.createOscillator(),g=ac.createGain();
   o.type="square";o.frequency.value=freq;g.gain.value=.035;
   o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.stop(ac.currentTime+dur);
 }catch{}
}
soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?"🔊 声音：开":"🔇 声音：关"};

function loadFile(file){
 if(!file)return;
 const url=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{
   img=im;URL.revokeObjectURL(url);start.classList.add("hide");
   resetRound(false);popup("直接开干 😤");beep(110,.08);
 };
 im.src=url;
}
photo.onchange=e=>loadFile(e.target.files?.[0]);
$("startBtn").onclick=()=>photo.click();

function resetRound(showStart=false){
 combo=0;rage=0;lastHit=0;parts=[];maxTriggered=false;bruise=0;dizzy=0;centerObj();updateHUD();
 ending.classList.remove("show");
 if(showStart)start.classList.remove("hide");
}

$("again").onclick=()=>{resetRound(false);popup("Round 2 😤")};

function addCombo(power=1){
 const now=performance.now();
 combo=(now-lastHit<850)?combo+1:1;lastHit=now;
 rage=Math.min(100,rage+2.1*power);bruise=Math.min(5,bruise+.16*power);dizzy=Math.min(1,dizzy+.025*power);
 updateHUD();

 if(combo===1) reward("BONK!","精神状态 +2");
 if(combo===20) reward("20 COMBO","工资 +$0");
 if(combo===50) reward("50 COMBO","KPI -1%");
 if(combo===80) reward("80 COMBO","老板音量 -70%");
 if(combo===100) reward("100 COMBO","准时下班概率 +0.01%");
 if(combo%12===0 && Math.random()<.75) spawnIntrusion();

 if(rage>=100&&!maxTriggered){maxTriggered=true;setTimeout(maxRage,180)}
}
function particleText(txt,x,y,s=18){
 parts.push({t:"txt",txt,x,y,vx:(Math.random()-.5)*3.2,vy:-1.5-Math.random()*2.2,l:58,s});
}
function hit(x,y,power=1){
 addCombo(power);beep(115+Math.random()*70,.035);
 obj.vx+=(obj.x-x)*.04*power+(Math.random()-.5)*2;
 obj.vy+=(obj.y-y)*.032*power-1.3*power;
 obj.vr+=(Math.random()-.5)*.22*power;
 obj.sx=1.15;obj.sy=.86;
 const words=["BONK!","POW!","啪叽","烦恼-1","KPI -1%","工资 +$0","😤","✨"];
 for(let i=0;i<5;i++)particleText(words[Math.floor(Math.random()*words.length)],obj.x+(Math.random()-.5)*55,obj.y+(Math.random()-.5)*80,15+Math.random()*10);
}

function startCharge(){
 charging=true;chargeStart=performance.now();chargeWrap.classList.add("show");
}
function releaseCharge(){
 if(!charging)return;
 const p=Math.min(3,(performance.now()-chargeStart)/650+1);
 charging=false;chargeWrap.classList.remove("show");chargeEl.style.width="0%";
 popup("BOOM 💥");hit(obj.x-80,obj.y+20,p*1.5);obj.vx+=(Math.random()>.5?1:-1)*6*p;obj.vy-=5*p;beep(72,.12);
}

function swipeAction(dx,dy,dt){
 const ax=Math.abs(dx),ay=Math.abs(dy),speed=Math.hypot(dx,dy)/Math.max(dt,1);
 if(Math.max(ax,ay)<65 || speed<.25)return false;

 if(ax>ay){
   obj.vx=Math.sign(dx)*Math.min(18,7+speed*8);obj.vy=-2;obj.vr=Math.sign(dx)*.28;
   popup(dx>0?"💨 甩去右边":"💨 甩去左边");addCombo(2);beep(95,.06);
 }else if(dy<0){
   obj.vy=-18;obj.vx=dx*.05;obj.vr=.25;popup("🚀 送他上天");addCombo(2.5);beep(220,.08);
 }else{
   popup("🗑️ 丢垃圾桶");addCombo(2.5);trashEnding(false);
 }
 return true;
}

stage.addEventListener("pointerdown",e=>{
 if(!img || ending.classList.contains("show"))return;
 const r=stage.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,now=performance.now();
 pointer={down:true,drag:false,startX:x,startY:y,lastX:x,lastY:y,startT:now,lastT:now};
 const inside=Math.hypot(x-obj.x,y-obj.y)<155;
 if(inside){
   holdTimer=setTimeout(()=>{if(pointer.down&&!pointer.drag)startCharge()},420);
 }else{
   hit(x,y,1);
 }
 stage.setPointerCapture?.(e.pointerId);
});
stage.addEventListener("pointermove",e=>{
 if(!pointer.down)return;
 const r=stage.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,now=performance.now();
 const moved=Math.hypot(x-pointer.startX,y-pointer.startY);
 if(moved>12){
   clearTimeout(holdTimer);
   if(charging){charging=false;chargeWrap.classList.remove("show");chargeEl.style.width="0%"}
 }
 if(moved>18 && Math.hypot(pointer.startX-obj.x,pointer.startY-obj.y)<160){
   pointer.drag=true;
   const dt=Math.max(16,now-pointer.lastT);
   obj.vx=(x-pointer.lastX)/dt*16;obj.vy=(y-pointer.lastY)/dt*16;obj.x=x;obj.y=y;
 }
 pointer.lastX=x;pointer.lastY=y;pointer.lastT=now;
});
stage.addEventListener("pointerup",e=>{
 if(!pointer.down)return;
 clearTimeout(holdTimer);
 const r=stage.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,now=performance.now();
 const dx=x-pointer.startX,dy=y-pointer.startY,dt=now-pointer.startT;
 if(charging){releaseCharge()}
 else if(pointer.drag){ if(!swipeAction(dx,dy,dt)) addCombo(1.2) }
 else if(Math.hypot(dx,dy)<12 && dt<420){ hit(x,y,1) }
 else swipeAction(dx,dy,dt);
 pointer.down=false;pointer.drag=false;
});
stage.addEventListener("pointercancel",()=>{pointer.down=false;pointer.drag=false;clearTimeout(holdTimer);charging=false;chargeWrap.classList.remove("show")});

function spawnIntrusion(){
 if(intrusionEl)return;
 const el=document.createElement("div");el.className="intrusion";
 el.innerHTML=workLines[Math.floor(Math.random()*workLines.length)]+"<small>一巴掌 swipe 掉它</small>";
 stage.appendChild(el);intrusionEl=el;
 const r=stage.getBoundingClientRect();
 const x=r.width*(.28+Math.random()*.44),y=r.height*(.28+Math.random()*.35);
 el.style.left=x+"px";el.style.top=y+"px";
 intrusionState={x,y,startX:0,startY:0,down:false};
 el.addEventListener("pointerdown",ev=>{intrusionState.down=true;intrusionState.startX=ev.clientX;intrusionState.startY=ev.clientY;el.setPointerCapture?.(ev.pointerId)});
 el.addEventListener("pointermove",ev=>{
   if(!intrusionState.down)return;
   const dx=ev.clientX-intrusionState.startX,dy=ev.clientY-intrusionState.startY;
   el.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) rotate(${dx*.05}deg)`;
 });
 el.addEventListener("pointerup",ev=>{
   const dx=ev.clientX-intrusionState.startX,dy=ev.clientY-intrusionState.startY;
   intrusionState.down=false;
   if(Math.hypot(dx,dy)>60){
     el.classList.add("fly");el.style.transform=`translate(calc(-50% + ${dx*5}px),calc(-50% + ${dy*5}px)) rotate(${dx*.2}deg)`;
     reward("已处理","甩锅成功 +1");beep(180,.05);
     setTimeout(()=>{el.remove();intrusionEl=null},320);
   }else el.style.transform="translate(-50%,-50%)";
 });
 setTimeout(()=>{if(intrusionEl===el){el.classList.add("fly");setTimeout(()=>{el.remove();intrusionEl=null},320)}},4200);
}

function drawPixelFace(){
 const tiny=document.createElement("canvas");tiny.width=34;tiny.height=34;
 const t=tiny.getContext("2d"),side=Math.min(img.width,img.height),sx=(img.width-side)/2,sy=(img.height-side)/2;
 t.drawImage(img,sx,sy,side,side,0,0,34,34);
 ctx.imageSmoothingEnabled=false;ctx.drawImage(tiny,-49,-49,98,98);ctx.imageSmoothingEnabled=true;
}
function drawBag(){
 ctx.save();ctx.translate(obj.x,obj.y);ctx.rotate(obj.rot);ctx.scale(obj.sx,obj.sy);
 ctx.strokeStyle="#b9c0c8";ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(0,-270);ctx.lineTo(0,-162);ctx.stroke();

 const g=ctx.createLinearGradient(-95,0,95,0);g.addColorStop(0,"#762b29");g.addColorStop(.5,"#c24b3d");g.addColorStop(1,"#7b2d29");
 ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(-94,-163,188,328,62);ctx.fill();
 ctx.fillStyle="#5f2522";ctx.fillRect(-94,-113,188,16);

 ctx.save();ctx.beginPath();ctx.arc(0,-52,54,0,Math.PI*2);ctx.clip();drawPixelFace();ctx.restore();
 ctx.strokeStyle="#fff";ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,-52,54,0,Math.PI*2);ctx.stroke();

 if(bruise>1){
   ctx.globalAlpha=Math.min(.82,bruise/5);
   ctx.fillStyle="#72539e";ctx.beginPath();ctx.ellipse(-28,-67,18,9,-.2,0,Math.PI*2);ctx.fill();
   ctx.fillStyle="#5577a7";ctx.beginPath();ctx.ellipse(30,-43,16,8,.25,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
 }
 if(dizzy>.12){
   ctx.font="27px system-ui";ctx.textAlign="center";ctx.fillText("⭐",-61,-92);ctx.fillText("💫",62,-95);
 }
 ctx.font="900 22px system-ui";ctx.fillStyle="#fff";ctx.textAlign="center";ctx.fillText("烦恼沙包",0,65);
 ctx.font="700 13px system-ui";ctx.fillText("今天的破事都在这里",0,91);
 ctx.restore();
}

function physics(){
 if(pointer.drag)return;
 const w=stage.clientWidth,h=stage.clientHeight;
 obj.vy+=.25;obj.x+=obj.vx;obj.y+=obj.vy;obj.rot+=obj.vr;
 obj.vx*=.985;obj.vy*=.992;obj.vr*=.991;obj.sx+=(1-obj.sx)*.16;obj.sy+=(1-obj.sy)*.16;
 const rx=105,ry=168;
 if(obj.x<rx){obj.x=rx;obj.vx=Math.abs(obj.vx)*.76}
 if(obj.x>w-rx){obj.x=w-rx;obj.vx=-Math.abs(obj.vx)*.76}
 if(obj.y<ry){obj.y=ry;obj.vy=Math.abs(obj.vy)*.7}
 if(obj.y>h-ry){obj.y=h-ry;obj.vy=-Math.abs(obj.vy)*.7}
 obj.vx+=(w/2-obj.x)*.0038;obj.vy+=(h*.54-obj.y)*.0038;
}

function randomEnding(){
 const ends=[
  ["🚀","rocket"],["🗑️","trash"],["🕳️","blackhole"],["📧","email"],
  ["📊","excel"],["🖨️","printer"],["🥔","pan"],["🕕","lights"]
 ];
 return ends[Math.floor(Math.random()*ends.length)];
}
function maxRage(){
 popup("🔥 DULAN MAX 🔥",700);beep(65,.15);
 for(let i=0;i<15;i++)setTimeout(()=>hit(obj.x+(Math.random()-.5)*130,obj.y+(Math.random()-.5)*160,1.25),i*45);
 const [fx,type]=randomEnding();
 setTimeout(()=>runEnding(fx,type),850);
}
function trashEnding(manual=true){runEnding("🗑️","trash",manual)}
function runEnding(fx,type,manual=false){
 endingFx.textContent=fx;
 if(type==="rocket"){obj.vy=-22;obj.vr=.4;popup("🚀 送出办公室")}
 if(type==="trash"){obj.vy=16;obj.vx=10;popup("🗑️ 送进垃圾桶")}
 if(type==="blackhole"){obj.sx=.1;obj.sy=.1;obj.vr=.8;popup("🕳️ 吸走")}
 if(type==="email"){for(let i=0;i<25;i++)particleText("📧",Math.random()*stage.clientWidth,Math.random()*stage.clientHeight,26);popup("📧 999+")}
 if(type==="excel"){popup("📊 Excel Sheet 压扁");obj.sx=1.5;obj.sy=.25}
 if(type==="printer"){popup("🖨️ Printer Offline");obj.vx=12;obj.vr=.5}
 if(type==="pan"){popup("🥔 甩锅成功");obj.vr=.7}
 if(type==="lights"){popup("🕕 到点，下班");}
 setTimeout(()=>ending.classList.add("show"),650);
}

function loop(){
 const w=stage.clientWidth,h=stage.clientHeight;
 ctx.clearRect(0,0,w,h);
 if(img){physics();drawBag()}
 if(charging){
   const p=Math.min(100,(performance.now()-chargeStart)/900*100);chargeEl.style.width=p+"%";
 }
 for(const p of parts){
   ctx.save();ctx.font=p.s+"px system-ui";ctx.textAlign="center";ctx.fillText(p.txt,p.x,p.y);ctx.restore();
   p.x+=p.vx;p.y+=p.vy;p.l--;
 }
 parts=parts.filter(p=>p.l>0&&p.y<h+120);
 requestAnimationFrame(loop);
}
loop();
</script>
